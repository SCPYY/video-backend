spring:
  # MySQL数据库（开发环境）
  datasource:
    url: jdbc:mysql://localhost:3306/video-db?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password:
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
  # Redis配置
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0

# 日志级别
logging:
  level:
    com.project: debug
    org.springframework.security: debug

app:
  media:
    # Windows示例：C:/ffmpeg/bin/ffprobe.exe；Linux可配置为 /usr/bin/ffprobe
    ffprobe-path: ${FFPROBE_PATH:C:/Users/Administrator/Desktop/backend/tools/ffmpeg-9.0-essentials_build/bin/ffprobe.exe}
