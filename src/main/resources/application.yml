server:
  port: 8080

spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
    default-property-inclusion: non_null
  servlet:
    multipart:
      max-file-size: 2GB
      max-request-size: 2GB

app:
  upload:
    root: ${UPLOAD_ROOT:uploads}
  media:
    ffprobe-path: ${FFPROBE_PATH:C:/Users/Administrator/Desktop/backend/tools/ffmpeg-9.0-essentials_build/bin/ffprobe.exe}

# MyBatis-Plus配置
mybatis-plus:
  mapper-locations: classpath:mapper/*.xml
  type-aliases-package: com.project.module.*.entity
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# Knife4j API文档配置
knife4j:
  enable: true
  setting:
    language: zh_cn

# JWT配置
jwt:
  secret: ${JWT_SECRET:your-256-bit-secret-key-change-in-production}
  expiration: 7200000        # 2小时 (毫秒)
  refresh-expiration: 604800000  # 7天 (毫秒)
  issuer: project-backend

# 支付配置 (通过环境变量注入)
payment:
  paypal:
    client-id: ${PAYPAL_CLIENT_ID:}
    client-secret: ${PAYPAL_CLIENT_SECRET:}
    webhook-secret: ${PAYPAL_WEBHOOK_SECRET:}
    mode: ${PAYPAL_MODE:sandbox}
  stripe:
    secret-key: ${STRIPE_SECRET_KEY:}
    webhook-secret: ${STRIPE_WEBHOOK_SECRET:}
